# Publishes a GitHub release with the plugin zip whenever the version in __init__.py
# reaches main without a matching release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read plugin version
        id: version
        run: |
          version=$(python3 - <<'EOF'
          import ast
          tree = ast.parse(open('__init__.py').read())
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign) and any(getattr(t, 'id', None) == 'version' for t in node.targets):
                  print('.'.join(map(str, ast.literal_eval(node.value))))
                  break
          EOF
          )
          test -n "$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.existing.outputs.found != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq gettext zip
          ./build.sh

      - name: Publish release
        if: steps.existing.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" ai_metadata.zip --target "$GITHUB_SHA" --title "${{ steps.version.outputs.tag }}" --generate-notes
